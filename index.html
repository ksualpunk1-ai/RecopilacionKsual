<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recopilación Ksual</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#111;
    color:white;
    text-align:center;
}

header{
    padding:20px;
    font-size:24px;
    background:#000;
}

.apps{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.card{
    background:#1c1c1c;
    width:220px;
    padding:15px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.5);
}

.card img{
    width:100%;
    border-radius:8px;
}

.card a{
    display:block;
    margin-top:10px;
    padding:10px;
    background:#00b894;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

.card a:hover{
    background:#00d9a5;
}
</style>
</head>

<body>

<header>📱 Recopilación Ksual</header>

<div class="apps">

<div class="card">
    <img src="https://via.placeholder.com/200x200" alt="App 1">
    <h3>Nombre App</h3>
    <a href="kawaiianimes.apk">Descargar</a>
</div>

</div>

</body>
</html>
